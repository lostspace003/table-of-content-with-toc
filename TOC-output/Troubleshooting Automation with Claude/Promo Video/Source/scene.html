<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070b24;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff}
:root{--ac:#F59E0B;--ac2:#6D8CFF}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 800px at 25% 20%,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
canvas#bg{position:absolute;inset:0}
.layer{position:absolute;inset:0;opacity:0}
.logo{position:absolute;top:30px;right:50px;height:84px}
.badge{display:inline-block;background:var(--ac);color:#101010;font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px;border-radius:8px}
.h1{font-size:92px;font-weight:800;line-height:1.08;letter-spacing:-.025em;white-space:pre-line;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.h2{font-size:40px;color:#C7D2EA;font-weight:500;line-height:1.3;white-space:pre-line}
.q{font-size:60px;font-weight:800;color:var(--ac);line-height:1.15;white-space:pre-line;letter-spacing:-.02em}
.big{font-size:150px;font-weight:800;color:var(--ac);letter-spacing:-.03em;line-height:1}
.card{position:absolute;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.item{position:relative;padding-left:26px;margin-top:34px}
.item:before{content:"";position:absolute;left:0;top:6px;width:7px;height:52px;background:var(--ac);border-radius:4px}
.item b{display:block;font-size:40px;font-weight:700;line-height:1.1}
.item span{display:block;font-size:26px;color:#AEB9D6;margin-top:6px}
.panel{position:absolute;background:#0b0f1f;border:2px solid rgba(140,160,230,.5);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.panel .bar{height:44px;background:#141a33;display:flex;align-items:center;gap:10px;padding-left:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel .bar i{width:14px;height:14px;border-radius:50%;display:inline-block}
.panel pre{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:21px;line-height:1.55;padding:22px 26px;color:#D8E0F5;white-space:pre-wrap;word-break:normal;overflow-wrap:normal}
.panel pre .add{color:#5EE39A}.panel pre .del{color:#FF7B7B}.panel pre .cmd{color:#FFD56B}.panel pre .ok{color:#5EE39A}.panel pre .warn{color:#FFB454}.panel pre .dim{color:#7E8BB0}
.cursor{display:inline-block;width:14px;height:28px;background:var(--ac);vertical-align:-4px;margin-left:2px}
.cap{position:absolute;left:0;right:0;bottom:46px;text-align:center}
.cap span{display:inline-block;background:rgba(0,0,0,.72);color:#fff;font-size:36px;font-weight:500;padding:12px 28px;border-radius:14px;max-width:1500px;line-height:1.35}
.photo{position:absolute;width:420px;height:420px;border-radius:50%;border:10px solid var(--ac);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.hex{position:absolute;width:260px;height:290px}
.stat{position:absolute;left:0;width:1100px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:22px;padding:22px 30px;display:flex;align-items:center;gap:28px}
.stat .n{font-size:84px;font-weight:800;color:var(--ac);min-width:230px;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:36px;font-weight:600;line-height:1.2}
.tool{position:absolute;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 26px;font-size:30px;font-weight:600;white-space:nowrap}
.tool svg{width:44px;height:44px}
.mod{position:absolute;display:flex;align-items:center;gap:20px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:20px;padding:18px 26px;width:860px}
.mod .ic{width:68px;height:68px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.mod .ic svg{width:40px;height:40px}
.mod b{font-size:30px;font-weight:700;line-height:1.15;display:block}
.mod small{font-size:22px;color:#AEB9D6;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<img class="logo" id="logo" src="logo-dark.png">
<div id="layers"></div>
<div class="cap" id="cap"><span id="captxt"></span></div>
</div>

.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z\"/></svg>", "capstone": "<svg class=\"\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" role=\"img\" aria-label=\"capstone\" style=\"color:#fff\"><path d=\"M12 3l9 5-9 5-9-5z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M5 11v4c0 2 3.5 4 7 4s7-2 7-4v-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>"}, "timeline": [{"id": "hook", "start": 0.0, "end": 33.684, "cue": 18.582}, {"id": "intro", "start": 33.684, "end": 38.274}, {"id": "story", "start": 38.274, "end": 64.176}, {"id": "path0", "start": 64.176, "end": 113.844, "cue": 28.494, "itemGap": 11.667, "cps": 35}, {"id": "path1", "start": 113.844, "end": 151.986, "itemGap": 11.714, "cps": 35}, {"id": "path2", "start": 151.986, "end": 185.448, "itemGap": 10.154, "cps": 35}, {"id": "path3", "start": 185.448, "end": 227.316, "cue": 21.966, "itemGap": 9.717, "cps": 35}, {"id": "labs", "start": 227.316, "end": 251.634}, {"id": "mods", "start": 251.634, "end": 298.824}, {"id": "princ", "start": 298.824, "end": 319.086, "itemGap": 2.466}, {"id": "stats", "start": 319.086, "end": 328.308, "itemGap": 1.244}, {"id": "who", "start": 328.308, "end": 348.162}, {"id": "cta", "start": 348.162, "end": 363.368}], "captions": [{"s": 1.2, "e": 4.396, "text": "An incident lands in ServiceNow at nine at night."}, {"s": 4.396, "e": 6.614, "text": "The acknowledgement mail goes out,"}, {"s": 6.614, "e": 8.505, "text": "and then the questions begin."}, {"s": 8.505, "e": 10.07, "text": "Which V I P? Since when?"}, {"s": 10.07, "e": 12.353, "text": "What changed? Who is looking at it?"}, {"s": 12.353, "e": 15.158, "text": "And the engineer on call is typing the same"}, {"s": 15.158, "e": 17.832, "text": "first five commands they typed last week."}, {"s": 18.582, "e": 20.727, "text": "What if an agent read the ticket,"}, {"s": 20.727, "e": 22.678, "text": "asked for the missing details,"}, {"s": 22.678, "e": 25.473, "text": "pulled the evidence from the load balancer,"}, {"s": 25.473, "e": 28.138, "text": "and suggested the exact C L I commands to"}, {"s": 28.138, "e": 32.039, "text": "run next? Troubleshooting, automated, with a person still in"}, {"s": 32.039, "e": 33.534, "text": "charge of every change."}, {"s": 34.284, "e": 38.124, "text": "Gennoor Tech presents Troubleshooting Automation with Claude."}, {"s": 38.874, "e": 41.617, "text": "One incident in. One resolution note out."}, {"s": 41.617, "e": 45.229, "text": "You build the troubleshooting workflow in ten modules,"}, {"s": 45.229, "e": 48.975, "text": "and every module ends with something that actually runs."}, {"s": 48.975, "e": 51.182, "text": "Claude reads, plans and explains."}, {"s": 51.182, "e": 55.597, "text": "Deterministic Python collects the evidence and updates the ticket."}, {"s": 55.597, "e": 58.875, "text": "A person approves anything that touches a device."}, {"s": 58.875, "e": 60.548, "text": "And every step is logged,"}, {"s": 60.548, "e": 63.625, "text": "in your audit trail and in the ServiceNow work"}, {"s": 63.625, "e": 64.026, "text": "notes."}, {"s": 64.776, "e": 68.137, "text": "You start with the incident lifecycle in ServiceNow,"}, {"s": 68.137, "e": 70.98, "text": "from the moment the ticket is created to the"}, {"s": 70.98, "e": 74.664, "text": "acknowledgement mail and the first troubleshooting reply."}, {"s": 74.664, "e": 77.249, "text": "You map where an agent may act and where"}, {"s": 77.249, "e": 79.834, "text": "it may not. Then you set up Claude Code,"}, {"s": 79.834, "e": 81.773, "text": "the Claude Agent S D K and M C"}, {"s": 81.773, "e": 83.971, "text": "P servers for this exact workflow,"}, {"s": 83.971, "e": 86.103, "text": "with a read only ServiceNow tool,"}, {"s": 86.103, "e": 87.655, "text": "a read only device tool,"}, {"s": 87.655, "e": 90.757, "text": "and nothing else. Credentials stay in the vault,"}, {"s": 90.757, "e": 91.92, "text": "never in a prompt."}, {"s": 92.67, "e": 96.548, "text": "Then intake. You pull the incident through the ServiceNow"}, {"s": 96.548, "e": 98.249, "text": "Table A P I, validate it,"}, {"s": 98.249, "e": 102.263, "text": "and let Claude compare it against a primary troubleshooting"}, {"s": 102.263, "e": 104.032, "text": "checklist. Affected V I P,"}, {"s": 104.032, "e": 106.754, "text": "symptom, start time, scope, last change."}, {"s": 106.754, "e": 109.884, "text": "The agent lists what is missing and drafts the"}, {"s": 109.884, "e": 113.694, "text": "clarification mail. An engineer reviews it and sends it."}, {"s": 114.444, "e": 117.19, "text": "Day two is evidence and diagnosis."}, {"s": 117.19, "e": 120.663, "text": "Deterministic collectors run F5 t m s h and"}, {"s": 120.663, "e": 123.974, "text": "iControl REST, the NetScaler NITRO A P I,"}, {"s": 123.974, "e": 127.204, "text": "Radware Alteon and other load balancers,"}, {"s": 127.204, "e": 130.192, "text": "and the Cisco A P I C REST interface,"}, {"s": 130.192, "e": 133.18, "text": "and return typed facts with a device,"}, {"s": 133.18, "e": 135.684, "text": "a timestamp and the raw output."}, {"s": 135.684, "e": 139.399, "text": "Claude turns those facts into a ranked list of"}, {"s": 139.399, "e": 143.033, "text": "likely causes, and for each cause the exact C"}, {"s": 143.033, "e": 146.425, "text": "L I command that confirms or rules it out."}, {"s": 146.425, "e": 147.96, "text": "Structured J S O N,"}, {"s": 147.96, "e": 150.544, "text": "with a citation for every claim,"}, {"s": 150.544, "e": 151.836, "text": "never free text."}, {"s": 152.586, "e": 156.724, "text": "Then the guardrails. Every suggested command is classified read"}, {"s": 156.724, "e": 160.009, "text": "only or state changing. Read only commands can run"}, {"s": 160.009, "e": 163.424, "text": "in the lab automatically. Anything else waits for an"}, {"s": 163.424, "e": 165.92, "text": "engineer to approve, and the approval,"}, {"s": 165.92, "e": 168.876, "text": "the command and the output are written to the"}, {"s": 168.876, "e": 171.701, "text": "audit log and to the ServiceNow work notes."}, {"s": 171.701, "e": 174.657, "text": "You will try to push a change through without"}, {"s": 174.657, "e": 177.219, "text": "approval, and you will watch it refuse."}, {"s": 177.219, "e": 178.992, "text": "Then you run the full loop."}, {"s": 178.992, "e": 183.327, "text": "Suggest, approve, execute, interpret, until the cause is confirmed"}, {"s": 183.327, "e": 185.298, "text": "or a senior engineer is paged."}, {"s": 186.048, "e": 187.734, "text": "Day three is the template."}, {"s": 187.734, "e": 191.234, "text": "Reason, action, next action. Claude drafts it from the"}, {"s": 191.234, "e": 194.735, "text": "evidence it was given, cites the command output behind"}, {"s": 194.735, "e": 197.782, "text": "every line, and marks what it could not verify."}, {"s": 197.782, "e": 200.7, "text": "You post it to the incident through the Table"}, {"s": 200.7, "e": 202.45, "text": "A P I, with the close code,"}, {"s": 202.45, "e": 205.951, "text": "and you create the knowledge article the next incident"}, {"s": 205.951, "e": 206.664, "text": "will reuse."}, {"s": 207.414, "e": 210.706, "text": "You finish by wiring it all into a troubleshooting"}, {"s": 210.706, "e": 213.866, "text": "page. A FastAPI service with the incident queue,"}, {"s": 213.866, "e": 216.105, "text": "the evidence, the suggested steps,"}, {"s": 216.105, "e": 219.331, "text": "the approve and reject buttons and the audit tab."}, {"s": 219.331, "e": 222.623, "text": "Tested with pytest against recorded device output,"}, {"s": 222.623, "e": 226.244, "text": "and shipped through a reviewed GitHub pull request with"}, {"s": 226.244, "e": 227.166, "text": "Actions green."}, {"s": 227.916, "e": 231.557, "text": "Every lab runs against a ServiceNow developer instance,"}, {"s": 231.557, "e": 233.94, "text": "lab load balancers and a Cisco A C I"}, {"s": 233.94, "e": 237.78, "text": "sandbox, with synthetic incidents that have real symptoms."}, {"s": 237.78, "e": 240.958, "text": "You will watch the agent ask the right question,"}, {"s": 240.958, "e": 244.136, "text": "run the right command, and refuse the wrong one."}, {"s": 244.136, "e": 247.181, "text": "And in the capstone a fresh incident lands and"}, {"s": 247.181, "e": 251.153, "text": "your team takes it from acknowledgement to posted resolution"}, {"s": 251.153, "e": 251.484, "text": "note."}, {"s": 252.234, "e": 254.712, "text": "Here is the full table of contents,"}, {"s": 254.712, "e": 256.623, "text": "10 modules over three days."}, {"s": 256.623, "e": 261.225, "text": "Day one: The troubleshooting workflow and the ServiceNow incident"}, {"s": 261.225, "e": 263.632, "text": "lifecycle; Setting up Claude Code,"}, {"s": 263.632, "e": 266.605, "text": "the Agent SDK and MCP for incident triage;"}, {"s": 266.605, "e": 270.074, "text": "and Incident intake through the Table API and the"}, {"s": 270.074, "e": 275.029, "text": "acknowledgement mail. Day two: Evidence collection from load balancers"}, {"s": 275.029, "e": 279.702, "text": "and ACI; Claude suggests troubleshooting ste dent into a documented,"}, {"s": 351.52, "e": 355.513, "text": "repeatable fix. Troubleshooting Automation with Claude."}, {"s": 355.513, "e": 357.618, "text": "Enrol now at gennoor dot com."}], "theme": {"motif": "code", "accent": "#FB923C", "accent2": "#FED7AA", "bg": ["#4a2a0e", "#241406", "#0d0702"], "bed": 100}};

function mInvoice(t,a,big){const cx=big?1430:1600,cy=big?480:600,S=big?1:0.65;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  bills.forEach((b,i)=>{const dy=Math.sin(t*0.9+i*2)*10;ctx.globalAlpha=a*0.95;ctx.fillStyle=hexA(TH.bg[1],0.96);ctx.strokeStyle=TH.accent2;ctx.lineWidth=2.5;rrect(b.x,b.y+dy,300,200,12);ctx.fill();ctx.stroke();

    ctx.globalAlpha=a;ctx.fillStyle=TH.accent;ctx.font='800 18px Inter,sans-serif';ctx.textAlign='left';ctx.fillText('BILL',b.x+24,b.y+dy+28);
    ctx.fillStyle=b.g?TH.accent:'#5EE39A';rrect(b.x+200,b.y+dy+14,80,24,6);ctx.fill();ctx.fillStyle='#101010';ctx.font='700 14px Inter,sans-serif';ctx.fillText(b.g?'GST 18%':'NO GST',b.x+209,b.y+dy+31);
    ctx.fillStyle='#fff';ctx.font='700 22px Inter,sans-serif';ctx.fillText('Total  '+b.amt,b.x+24,b.y+dy+180);});
  const k=(t*0.5)%1;ctx.globalAlpha=a*(1-k);ctx.strokeStyle='#5EE39A';ctx.lineWidth=4;ctx.beginPath();ctx.arc(130,290,20+k*40,0,6.28);ctx.stroke();

// pulse: heartbeat trace plus gauges for CPU, HA sync and uptime
function mPulse(t,a,big){const cx=big?1430:1560,cy=big?470:560,S=big?1:0.7;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  ctx.globalAlpha=a*0.9;ctx.strokeStyle=TH.accent;ctx.lineWidth=4;ctx.beginPath();const sh=(t*260)%260;
  for(let x=-330;x<=330;x+=4){const u=((x+sh)%260+260)%260;let y=0;if(u>100&&u<112)y=-(u-100)*9;else if(u>=112&&u<124)y=-108+(u-112)*18;else if(u>=124&&u<140)y=108-(u-124)*7;else y=Math.sin(u*0.3)*3;ctx.lineTo(x,y*0.6);}ctx.stroke();
  ctx.globalAlpha=a*0.25;ctx.strokeStyle=TH.accent2;ctx.lineWidth=1;for(let x=-330;x<=330;x+=30){ctx.beginPath();ctx.moveTo(x,-90);ctx.lineTo(x,90);ctx.stroke();}
  const gauges=[['CPU',0.5+0.3*Math.sin(t*0.7)],['HA sync',0.95],['uptime',0.85+0.05*Math.sin(t*0.3)]];
  gauges.forEach((g,i)=>{const gx=-230+i*230,gy=230;ctx.globalAlpha=a*0.4;ctx.lineWidth=12;ctx.strokeStyle=TH.accent2;ctx.beginPath();ctx.arc(gx,gy,70,3.14,6.283);ctx.stroke();
    ctx.globalAlpha=a;ctx.strokeStyle=g[1]>0.9?'#5EE39A':(g[1]>0.7?TH.accent:'#FF5A5A');ctx.beginPath();ctx.arc(gx,gy,70,3.14,3.14+3.14*g[1]);ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='700 20px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(g[0],gx,gy+28);ctx.fillStyle=TH.accent2;ctx.font='600 16px Inter,sans-serif';ctx.fillText(Math.round(g[1]*100)+'%',gx,gy-10);});
  ctx.restore();}

const dlines=Array.from({length:14},(_,i)=>({w:60+rnd()*140,s:rnd()}));
function mDiff(t,a,big){const cx=big?1430:1600,cy=big?470:580,S=big?1.3:0.7;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  [[-330,'physical'],[40,'cloud']].forEach(([x,lab])=>{ctx.globalAlpha=a*0.9;ctx.fillStyle=hexA(TH.bg[1],0.92);ctx.strokeStyle=TH.accent2;ctx.lineWidth=2.5;rrect(x,-280,290,560,14);ctx.fill();ctx.stroke();ctx.fillStyle=TH.accent;ctx.font='700 18px Inter,sans-serif';ctx.textAlign='left';ctx.fillText(lab.toUpperCase(),x+18,-250);});
  const hl=Math.floor(t*0.8)%14;
  dlines.forEach((l,i)=>{const y=-220+i*36;const st=l.s;const col=st>0.85?'#FF5A5A':(st>0.65?TH.accent:TH.accent2);const miss=st>0.92;
    ctx.globalAlpha=a*(i===hl?1:0.55);ctx.fillStyle=col;ctx.fillRect(-310,y,l.w,8);if(!miss)ctx.fillRect(60,y,l.w*(st>0.65?0.7:1),8);
    if(st>0.65){ctx.globalAlpha=a*0.5;ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-40,y+4);ctx.lineTo(40,y+4);ctx.stroke();}
    if(i===hl){ctx.globalAlpha=a*0.25;ctx.fillStyle=TH.accent;ctx.fillRect(-330,y-10,660,28);}});
  ctx.restore();}
// route: traceroute hops along a path with packets and latency labels
const hops=[[-360,120],[-240,-60],[-90,40],[60,-110],[200,20],[330,-70]];
function mRoute(t,a,big){const cx=big?1430:1600,cy=big?480:580,S=big?1.3:0.7;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  ctx.globalAlpha=a*0.6;ctx.strokeStyle=TH.accent2;ctx.lineWidth=3;ctx.beginPath();hops.forEach((h,i)=>i?ctx.lineTo(h[0],h[1]):ctx.moveTo(h[0],h[1]));ctx.stroke();
  const k=(t*0.35)%1;const seg=Math.min(hops.length-2,Math.floor(k*(hops.length-1)));const f=k*(hops.length-1)-seg;const A=hops[seg],B=hops[seg+1];
  ctx.globalAlpha=a;ctx.fillStyle=TH.accent;ctx.beginPath();ctx.arc(A[0]+(B[0]-A[0])*f,A[1]+(B[1]-A[1])*f,9,0,6.28);ctx.fill();
  hops.forEach((h,i)=>{ctx.globalAlpha=a;ctx.fillStyle=hexA(TH.bg[1],0.95);ctx.strokeStyle=i<=seg+1?TH.accent:TH.accent2;ctx.lineWidth=3;ctx.beginPath();ctx.arc(h[0],h[1],26,0,6.28);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='700 16px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(i===0?'src':(i===hops.length-1?'dst':'hop '+i),h[0],h[1]+6);
    ctx.fillStyle=TH.accent2;ctx.font='600 14px Inter,sans-serif';ctx.fillText((1.2+i*3.7).toFixed(1)+' ms',h[0],h[1]+48);});
  ctx.restore();}
// fabric: ACI spine-leaf topology with APIC cluster, upgraded node by node
function mFabric(t,a,big){const cx=big?1430:1600,cy=big?470:580,S=big?1.3:0.7;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  const spines=[[-120,-200],[120,-200]],leaves=[[-300,40],[-100,40],[100,40],[300,40]],apic=[[-80,230],[0,230],[80,230]];
  ctx.globalAlpha=a*0.5;ctx.strokeStyle=TH.accent2;ctx.lineWidth=2;for(const s of spines)for(const l of leaves){ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(l[0],l[1]);ctx.stroke();}
  const stage=Math.floor(t*0.5)%9;const nodes=[...apic,...spines,...leaves];
  nodes.forEach((n,i)=>{const done=i<stage,cur=i===stage;ctx.globalAlpha=a;ctx.fillStyle=hexA(TH.bg[1],0.95);ctx.strokeStyle=done?'#5EE39A':(cur?TH.accent:TH.accent2);ctx.lineWidth=cur?4:2.5;const w=i<3?50:120,h=i<3?50:50;rrect(n[0]-w/2,n[1]-h/2,w,h,10);ctx.fill();ctx.stroke();
    if(cur){const p=(t*0.5)%1;ctx.fillStyle=TH.accent;ctx.fillRect(n[0]-w/2+8,n[1]+h/2-12,(w-16)*p,5);}
    ctx.fillStyle='#fff';ctx.font='700 15px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(i<3?'APIC':(i<5?'spine '+(i-2):'leaf '+(i-4)),n[0],n[1]+5);});
  ctx.globalAlpha=a*0.7;ctx.fillStyle=TH.accent;ctx.font='700 16px Inter,sans-serif';ctx.fillText('upgrade group '+(stage<3?'APIC':(stage<5?'spines':'leaves')),0,310);
  ctx.restore();}
// gitgraph: commits on main and feature branches merging via pull requests
function mGit(t,a,big){const cx=big?1430:1600,cy=big?470:580,S=big?1.3:0.7;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  const sh=(t*40)%160;ctx.lineWidth=5;ctx.globalAlpha=a*0.8;ctx.strokeStyle=TH.accent2;ctx.beginPath();ctx.moveTo(-380,0);ctx.lineTo(380,0);ctx.stroke();
  ctx.strokeStyle=TH.accent;for(let i=0;i<3;i++){const x0=-420+i*320-sh;ctx.beginPath();ctx.moveTo(x0,0);ctx.quadraticCurveTo(x0+60,-110,x0+140,-110);ctx.lineTo(x0+200,-110);ctx.quadraticCurveTo(x0+280,-110,x0+300,0);ctx.stroke();
    for(let k=0;k<3;k++){ctx.fillStyle=TH.accent;ctx.beginPath();ctx.arc(x0+120+k*50,-110,10,0,6.28);ctx.fill();}
    ctx.fillStyle=hexA(TH.bg[1],0.95);ctx.strokeStyle='#5EE39A';ctx.lineWidth=2.5;rrect(x0+90,-190,180,44,10);ctx.fill();ctx.stroke();ctx.fillStyle='#5EE39A';ctx.font='700 16px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('PR  plan ok  review ok',x0+180,-162);ctx.lineWidth=5;}

  ctx.fillStyle='#fff';ctx.font='700 18px Inter,sans-serif';ctx.textAlign='left';ctx.fillText('main (protected)',-380,40);
  const k=(t*0.6)%1;ctx.globalAlpha=a*(1-k);ctx.strokeStyle='#5EE39A';ctx.lineWidth=3;ctx.beginPath();ctx.arc(300,0,14+k*40,0,6.28);ctx.stroke();
  ctx.restore();}

function colorLine(l){const e=esc(l);if(l.startsWith('+'))return `<span class="add">${e}</span>`;if(l.startsWith('-'))return `<span class="del">${e}</span>`;if(l.startsWith('$'))return `<span class="cmd">${e}</span>`;if(l.startsWith('?')||/BLOCKED|FAIL|UNKNOWN|rejected|REVIEW|hold|reopened|GAP|MORE EVIDENCE/.test(l))return `<span class="warn">${e}</span>`;if(/APPROVED|VALIDATED|ok|passed|shortlist|FIXED|allowed|blocked\b/.test(l)&&!l.startsWith('>'))return `<span class="ok">${e}</span>`;if(l.startsWith('>'))return `<span>${e}</span>`;return `<span class="dim">${e}</span>`;}

const T=DATA.timeline; // [{id, start, end}]
const g=id=>document.getElementById(id);
function showOnly(id){for(const k in scenes)scenes[k].style.opacity=(k===id)?1:0;}
function sceneAt(t){for(const s of T)if(t>=s.start&&t<s.end)return s;return T[T.length-1];}
function fadeEdge(t,s){const a=tw(t,s.start,0.5);const b=1-tw(t,s.end-0.5,0.5,easeIn);return Math.min(a,b);}
window.seek=function(t){
  const s=sceneAt(t);const r=t-s.start;const id=s.id;
  showOnly(id);const lay=scenes[id];lay.style.opacity=fadeEdge(t,s);
  drawBg(t, id==='hook'?(TH.motif==='network'?0.35:0.95):(id==='cta'||id==='intro'?0.75:0.3), id==='hook');
  g('logo').style.opacity=(id==='cta')?0:1;
  if(id==='hook'){rise(g('hk_b'),r,0.2);rise(g('hk_t'),r,0.5);rise(g('hk_s'),r,1.3);rise(g('hk_q'),r,s.cue||4.5);}
  else if(id==='intro'){pop(g('in_l'),r,0.1);rise(g('in_b'),r,0.5);rise(g('in_n'),r,0.9);rise(g('in_t'),r,1.6);pop(g('in_h'),r,2.0);g('in_h').style.transform+=` rotate(${Math.sin(t*0.8)*5}deg)`;}
  else if(id==='story'){rise(g('st_b'),r,0.2);rise(g('st_t'),r,0.5);pop(g('st_n'),r,1.6);rise(g('st_s'),r,2.6);pop(g('st_h'),r,0.8);g('st_h').style.transform+=` rotate(${Math.sin(t*0.8)*4}deg)`;}
  else if(id.startsWith('path')){const i=+id.slice(4);slideX(g(`p${i}_c`),r,0.1,0.7,-80);DATA.paths[i].items.forEach((_,k)=>rise(g(`p${i}_i${k}`),r,0.9+k*(s.itemGap||1.4)));slideX(g(`p${i}_p`),r,0.5,0.8,120);typePanel(g(`p${i}_p`).querySelector('pre'),DATA.paths[i].panel_lines,r,1.4,s.cps||48);}
  else if(id==='labs'){rise(g('lb_b'),r,0.2);rise(g('lb_t'),r,0.5);[0,1,2].forEach(i=>{const p=g('lb_p'+i);pop(p,r,1.2+i*0.6);p.style.transform+=` translateY(${Math.sin(t*1.1+i)*8}px)`;typePanel(p.querySelector('pre'),DATA.paths[i].panel_lines.slice(0,6),r,1.6+i*0.6,70);});}
  else if(id==='mods'){rise(g('md_b'),r,0.2);rise(g('md_t'),r,0.5);const per=(s.end-s.start-1.5)/Math.ceil(DATA.modules.length/MPAGE);DATA.modules.forEach((m,i)=>{const page=Math.floor(i/MPAGE);const st=1.2+page*per;const en=st+per;const e=g('md_'+i);if(r<st||r>=en){e.style.opacity=0;return;}const a=tw(r,st+(i%MPAGE)*0.12,0.5);const b=1-tw(r,en-0.4,0.4,easeIn);e.style.opacity=Math.min(a,b);e.style.transform=`translateY(${(1-a)*30}px)`;});}
  else if(id==='princ'){rise(g('pr_b'),r,0.2);rise(g('pr_t'),r,0.5);DATA.principles.forEach((_,i)=>rise(g('pr_'+i),r,1.2+i*(s.itemGap||1.5)));}
  else if(id==='stats'){rise(g('sx_b'),r,0.2);rise(g('sx_t'),r,0.5);DATA.stats.forEach((_,i)=>slideX(g('sx_'+i),r,1.0+i*(s.itemGap||1.6),0.7,120));}
  else if(id==='who'){rise(g('wh_b'),r,0.2);rise(g('wh_t'),r,0.5);rise(g('wh_s'),r,1.4);const tools=[...document.querySelectorAll('#wh_tools .tool')];let x=0,y=0;tools.forEach((e,i)=>{if(x+e.offsetWidth>1700){x=0;y+=100;}e.style.left=x+'px';e.style.top=y+'px';x+=e.offsetWidth+18;const p=tw(r,2.2+i*0.18,0.5);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*30}px)`;});}
  else if(id==='cta'){pop(g('ct_l'),r,0.2);pop(g('ct_h'),r,0.6);g('ct_h').style.transform+=` rotate(${Math.sin(t*0.8)*5}deg)`;rise(g('ct_q'),r,1.2);rise(g('ct_c'),r,2.0);rise(g('ct_u'),r,s.cue||4.0);}
  // captions
  let c='';for(const k of DATA.captions){if(t>=k.s&&t<k.e){c=k.text;break;}}
  g('captxt').textContent=c;g('cap').style.opacity=c?1:0;
};
</script></body></html>
