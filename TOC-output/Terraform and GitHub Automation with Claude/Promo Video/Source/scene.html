<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070b24;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff}
:root{--ac:#F59E0B;--ac2:#6D8CFF}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 800px at 25% 20%,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
canvas#bg{position:absolute;inset:0}
.layer{position:absolute;inset:0;opacity:0}
.logo{position:absolute;top:30px;right:50px;height:84px}
.badge{display:inline-block;background:var(--ac);color:#101010;font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px;border-radius:8px}
.h1{font-size:92px;font-weight:800;line-height:1.08;letter-spacing:-.025em;white-space:pre-line;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.h2{font-size:40px;color:#C7D2EA;font-weight:500;line-height:1.3;white-space:pre-line}
.q{font-size:60px;font-weight:800;color:var(--ac);line-height:1.15;white-space:pre-line;letter-spacing:-.02em}
.big{font-size:150px;font-weight:800;color:var(--ac);letter-spacing:-.03em;line-height:1}
.card{position:absolute;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.item{position:relative;padding-left:26px;margin-top:34px}
.item:before{content:"";position:absolute;left:0;top:6px;width:7px;height:52px;background:var(--ac);border-radius:4px}
.item b{display:block;font-size:40px;font-weight:700;line-height:1.1}
.item span{display:block;font-size:26px;color:#AEB9D6;margin-top:6px}
.panel{position:absolute;background:#0b0f1f;border:2px solid rgba(140,160,230,.5);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.panel .bar{height:44px;background:#141a33;display:flex;align-items:center;gap:10px;padding-left:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel .bar i{width:14px;height:14px;border-radius:50%;display:inline-block}
.panel pre{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:21px;line-height:1.55;padding:22px 26px;color:#D8E0F5;white-space:pre-wrap;word-break:normal;overflow-wrap:normal}
.panel pre .add{color:#5EE39A}.panel pre .del{color:#FF7B7B}.panel pre .cmd{color:#FFD56B}.panel pre .ok{color:#5EE39A}.panel pre .warn{color:#FFB454}.panel pre .dim{color:#7E8BB0}
.cursor{display:inline-block;width:14px;height:28px;background:var(--ac);vertical-align:-4px;margin-left:2px}
.cap{position:absolute;left:0;right:0;bottom:46px;text-align:center}
.cap span{display:inline-block;background:rgba(0,0,0,.72);color:#fff;font-size:36px;font-weight:500;padding:12px 28px;border-radius:14px;max-width:1500px;line-height:1.35}
.photo{position:absolute;width:420px;height:420px;border-radius:50%;border:10px solid var(--ac);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.hex{position:absolute;width:260px;height:290px}
.stat{position:absolute;left:0;width:1100px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:22px;padding:22px 30px;display:flex;align-items:center;gap:28px}
.stat .n{font-size:84px;font-weight:800;color:var(--ac);min-width:230px;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:36px;font-weight:600;line-height:1.2}
.tool{position:absolute;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 26px;font-size:30px;font-weight:600;white-space:nowrap}
.tool svg{width:44px;height:44px}
.mod{position:absolute;display:flex;align-items:center;gap:20px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:20px;padding:18px 26px;width:860px}
.mod .ic{width:68px;height:68px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.mod .ic svg{width:40px;height:40px}
.mod b{font-size:30px;font-weight:700;line-height:1.15;display:block}
.mod small{font-size:22px;color:#AEB9D6;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<img class="logo" id="logo" src="logo-dark.png">
<div id="layers"></div>
<div class="cap" id="cap"><span id="captxt"></span></div>
</div>

5 11v4c0 2 3.5 4 7 4s7-2 7-4v-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>"}, "timeline": [{"id": "hook", "start": 0.0, "end": 29.844, "cue": 13.59}, {"id": "intro", "start": 29.844, "end": 34.89}, {"id": "story", "start": 34.89, "end": 61.32}, {"id": "path0", "start": 61.32, "end": 110.532, "cue": 30.102, "itemGap": 11.553, "cps": 35}, {"id": "path1", "start": 110.532, "end": 139.146, "itemGap": 8.538, "cps": 35}, {"id": "path2", "start": 139.146, "end": 174.192, "itemGap": 8.011, "cps": 35}, {"id": "path3", "start": 174.192, "end": 223.572, "cue": 24.246, "itemGap": 11.595, "cps": 35}, {"id": "labs", "start": 223.572, "end": 243.786}, {"id": "mods", "start": 243.786, "end": 297.432}, {"id": "princ", "start": 297.432, "end": 317.694, "itemGap": 2.466}, {"id": "stats", "start": 317.694, "end": 327.444, "itemGap": 1.35}, {"id": "who", "start": 327.444, "end": 345.738}, {"id": "cta", "start": 345.738, "end": 360.896}], "captions": [{"s": 1.2, "e": 5.101, "text": "Your Terraform apply just removed a production virtual server."}, {"s": 5.101, "e": 6.611, "text": "The plan said minus one."}, {"s": 6.611, "e": 9.505, "text": "Nobody read it. The change went through at two"}, {"s": 9.505, "e": 12.588, "text": "in the morning, and the incident bridge opened at"}, {"s": 12.588, "e": 12.84, "text": "six."}, {"s": 13.59, "e": 15.571, "text": "What if Claude read every plan,"}, {"s": 15.571, "e": 18.127, "text": "explained every change in plain English,"}, {"s": 18.127, "e": 21.77, "text": "flagged the common mistakes before they reached a device,"}, {"s": 21.77, "e": 24.646, "text": "and the apply ran only after a person clicked"}, {"s": 24.646, "e": 27.777, "text": "approve? That is Terraform and GitHub automation,"}, {"s": 27.777, "e": 29.694, "text": "done with Claude, done safely."}, {"s": 30.444, "e": 34.74, "text": "Gennoor Tech presents Terraform and GitHub Automation with Claude."}, {"s": 35.49, "e": 38.351, "text": "One repository. One pull request per change."}, {"s": 38.351, "e": 40.496, "text": "You learn Terraform step by step,"}, {"s": 40.496, "e": 43.357, "text": "you learn the mistakes that burn real teams,"}, {"s": 43.357, "e": 45.827, "text": "and you put Claude to work as planner,"}, {"s": 45.827, "e": 49.468, "text": "explainer and reviewer. Claude drafts the code and reads"}, {"s": 49.468, "e": 52.588, "text": "the plan. Deterministic pipelines run the apply."}, {"s": 52.588, "e": 55.709, "text": "A human approves anything that touches a device,"}, {"s": 55.709, "e": 57.334, "text": "and every step is logged."}, {"s": 57.334, "e": 60.065, "text": "By the end you own a repository your whole"}, {"s": 60.065, "e": 61.17, "text": "team can work in."}, {"s": 61.92, "e": 65.768, "text": "You start with infrastructure as code for network and"}, {"s": 65.768, "e": 68.818, "text": "load balancer teams. Providers, resources,"}, {"s": 68.818, "e": 72.23, "text": "variables, outputs and state, written in H C L."}, {"s": 72.23, "e": 74.263, "text": "Then you set up Claude Code,"}, {"s": 74.263, "e": 76.514, "text": "the Claude Agent S D K and an M"}, {"s": 76.514, "e": 79.491, "text": "C P server that exposes the Terraform C L"}, {"s": 79.491, "e": 82.25, "text": "I as tools, so the agent can run init,"}, {"s": 82.25, "e": 85.59, "text": "validate and plan, but never apply on its own."}, {"s": 85.59, "e": 89.075, "text": "You will see exactly which tools the agent holds"}, {"s": 89.075, "e": 90.672, "text": "and which it does not."}, {"s": 91.422, "e": 93.4, "text": "Then Terraform, step by step."}, {"s": 93.4, "e": 96.674, "text": "Init, plan, apply, and the state file that makes"}, {"s": 96.674, "e": 99.129, "text": "it all work. You read a plan line by"}, {"s": 99.129, "e": 102.812, "text": "line, you import a virtual server that already exists,"}, {"s": 102.812, "e": 105.676, "text": "and you move to remote state with locking,"}, {"s": 105.676, "e": 107.586, "text": "workspaces for dev and prod,"}, {"s": 107.586, "e": 110.382, "text": "and modules you can reuse for every site."}, {"s": 111.132, "e": 113.77, "text": "Day two opens with the common mistakes."}, {"s": 113.77, "e": 117.827, "text": "Unpinned provider versions. Secrets hard coded in variables."}, {"s": 117.827, "e": 119.856, "text": "Count where for each belonged."}, {"s": 119.856, "e": 121.885, "text": "A state file committed to Git."}, {"s": 121.885, "e": 124.591, "text": "A targeted apply that left drift behind."}, {"s": 124.591, "e": 126.281, "text": "Each mistake gets a name,"}, {"s": 126.281, "e": 127.634, "text": "a symptom and a fix."}, {"s": 127.634, "e": 129.933, "text": "You reproduce each one in the lab,"}, {"s": 129.933, "e": 132.503, "text": "then wire in the checks that catch it:"}, {"s": 132.503, "e": 136.494, "text": "terraform format, validate, tflint and a Claude review that"}, {"s": 136.494, "e": 138.996, "text": "names the mistake and cites the line."}, {"s": 139.746, "e": 143.489, "text": "Then GitHub. Branches, commits, a git ignore that keeps"}, {"s": 143.489, "e": 146.211, "text": "state and secrets out of the repository,"}, {"s": 146.211, "e": 148.796, "text": "pull requests with required reviewers,"}, {"s": 148.796, "e": 151.11, "text": "code owners and branch protection."}, {"s": 151.11, "e": 154.512, "text": "GitHub Actions runs plan on every pull request and"}, {"s": 154.512, "e": 157.779, "text": "apply only on merge, with the plan output posted"}, {"s": 157.779, "e": 160.501, "text": "as a comment for the team to read before"}, {"s": 160.501, "e": 163.29, "text": "anyone clicks approve. Guardrails follow:"}, {"s": 163.29, "e": 165.468, "text": "an allow list of resource types,"}, {"s": 165.468, "e": 168.394, "text": "a block on destroy without a change ticket,"}, {"s": 168.394, "e": 170.98, "text": "approval gates in GitHub environments,"}, {"s": 170.98, "e": 174.042, "text": "and an audit record for every plan and apply."}, {"s": 174.792, "e": 178.132, "text": "Day three brings the agent into the review loop."}, {"s": 178.132, "e": 180.986, "text": "An Agent S D K application reads the plan"}, {"s": 180.986, "e": 181.751, "text": "as J S O N,"}, {"s": 181.751, "e": 184.883, "text": "returns a structured verdict with risk level,"}, {"s": 184.883, "e": 188.154, "text": "affected resources and a plain English summary,"}, {"s": 188.154, "e": 190.45, "text": "and posts it to the pull request."}, {"s": 190.45, "e": 193.025, "text": "It never merges and it never applies."}, {"s": 193.025, "e": 195.461, "text": "When it cannot classify a resource,"}, {"s": 195.461, "e": 197.688, "text": "it says so and asks for a human."}, {"s": 198.438, "e": 202.851, "text": "Finally, the devices themselves. The F5 BIG-IP provider for"}, {"s": 202.851, "e": 205.843, "text": "virtual servers, pools and certificates."}, {"s": 205.843, "e": 208.836, "text": "The Citrix A D C provider for NetScaler."}, {"s": 208.836, "e": 211.828, "text": "The Cisco A C I provider for tenants and"}, {"s": 211.828, "e": 216.166, "text": "bridge domains. And Python wrappers for Radware Alteon and"}, {"s": 216.166, "e": 220.43, "text": "other load balancers (Anaya LB) where no provider exists,"}, {"s": 220.43, "e": 223.422, "text": "so one workflow covers the whole estate."}, {"s": 224.172, "e": 227.838, "text": "Every lab runs against a shared GitHub organization and"}, {"s": 227.838, "e": 229.505, "text": "lab devices in a sandbox."}, {"s": 229.505, "e": 231.971, "text": "Nothing you do in the lab can reach a"}, {"s": 231.971, "e": 235.304, "text": "production device. You will commit a state file on"}, {"s": 235.304, "e": 237.37, "text": "purpose, watch Claude catch it,"}, {"s": 237.37, "e": 240.036, "text": "break a plan with an unintended destroy,"}, {"s": 240.036, "e": 243.036, "text": "and see the approval gate hold until a person"}, {"s": 243.036, "e": 243.636, "text": "says yes."}, {"s": 244.386, "e": 246.975, "text": "Here is the full table of contents,"}, {"s": 246.975, "e": 248.973, "text": "10 modules over three days."}, {"s": 248.973, "e": 252.82, "text": "Day one: Infrastructure as code for network and load"}, {"s": 252.82, "e": 255.705, "text": "balancer teams; Setting up Claude Code,"}, {"s": 255.705, "e": 258.738, "text": "the Agent SDK and MCP for Terraform work;"}, {"s": 258.738, "e": 261.475, "text": "and Terraform scripting step by step:"}, {"s": 261.475, "e": 263.991, "text": "init, plan, apply, state. Day two:"}, {"s": 263.991, "e": 267.986, "text": "Common Terraform mistakes and how to catch them early;"}, {"s": 267.986, "e": 272.055, "text": "GitHub repository fundamentals for infrastructure code;"}, {"s": 272.055, "e": 275.532, "text": "GitHub Actions pipelines: plan on pull request,"}, {"s": 275.532, "e": 277.825, "text": "apply on merge; and Guardrails,"}, {"s": 277.825, "e": 281.968, "text": "approvals and audit for Terraform and GitHub automation."}, {"s": 281.968, "e": 284.557, "text": "Day three: Claude as plan reviewer:"}, {"s": 284.557, "e": 287.443, "text": "Agent SDK, MCP and structured verdicts;"}, {"s": 287.443, "e": 291.364, "text": "Terraform for F5, NetScaler, Cisco ACI and other load"}, {"s": 291.364, "e": 297.282, "text": "balancers; and Capstone: end-to-end change through the Claude-reviewed pipeline."}, {"s": 298.032, "e": 302.204, "text": "Every build in this course follows six engineering principles."}, {"s": 302.204, "e": 304.02, "text": "Model output is a proposal,"}, {"s": 304.02, "e": 307.519, "text": "never a fact. Authorization lives outside the model."}, {"s": 307.519, "e": 310.479, "text": "A human approves every consequential action."}, {"s": 310.479, "e": 312.767, "text": "Decisions and evidence are logged."}, {"s": 312.767, "e": 316.737, "text": "The stack stays provider-agnostic. And quality is measured,"}, {"s": 316.737, "e": 317.544, "text": "not assumed."}, {"s": 318.294, "e": 320.887, "text": "Ten modules. Three days, hands-on."}, {"s": 320.887, "e": 324.091, "text": "Five common mistakes reproduced and fixed."}, {"s": 324.091, "e": 327.294, "text": "And zero applies without a human approval."}, {"s": 328.044, "e": 330.968, "text": "This course is for enterprise I T and network"}, {"s": 330.968, "e": 334.737, "text": "operations teams, load balancer and data center engineers,"}, {"s": 334.737, "e": 338.116, "text": "and platform teams moving to infrastructure as code,"}, {"s": 338.116, "e": 341.234, "text": "in India and worldwide. You need basic Linux and"}, {"s": 341.234, "e": 345.003, "text": "networking knowledge. Git helps, and no prior Terraform is"}, {"s": 345.003, "e": 345.588, "text": "required."}, {"s": 346.338, "e": 349.159, "text": "Ship every change through a pull request,"}, {"s": 349.159, "e": 353.15, "text": "not a prayer. Terraform and GitHub Automation with Claude."}, {"s": 353.15, "e": 355.146, "text": "Enrol now at gennoor dot com."}], "theme": {"motif": "gitgraph", "accent": "#A3E635", "accent2": "#D9F99D", "bg": ["#1f3a0f", "#0f1f07", "#050a03"], "bed": 124}};

  nodes.forEach((n,i)=>{const done=i<stage,cur=i===stage;ctx.globalAlpha=a;ctx.fillStyle=hexA(TH.bg[1],0.95);ctx.strokeStyle=done?'#5EE39A':(cur?TH.accent:TH.accent2);ctx.lineWidth=cur?4:2.5;const w=i<3?50:120,h=i<3?50:50;rrect(n[0]-w/2,n[1]-h/2,w,h,10);ctx.fill();ctx.stroke();
    if(cur){const p=(t*0.5)%1;ctx.fillStyle=TH.accent;ctx.fillRect(n[0]-w/2+8,n[1]+h/2-12,(w-16)*p,5);}
    ctx.fillStyle='#fff';ctx.font='700 15px Inter,sans-serif';ctx.textAlign='center';ctx.fillText(i<3?'APIC':(i<5?'spine '+(i-2):'leaf '+(i-4)),n[0],n[1]+5);});
  ctx.globalAlpha=a*0.7;ctx.fillStyle=TH.accent;ctx.font='700 16px Inter,sans-serif';ctx.fillText('upgrade group '+(stage<3?'APIC':(stage<5?'spines':'leaves')),0,310);
  ctx.restore();}
// gitgraph: commits on main and feature branches merging via pull requests
function mGit(t,a,big){const cx=big?1430:1600,cy=big?470:580,S=big?1.3:0.7;ctx.save();ctx.translate(cx,cy);ctx.scale(S,S);
  const sh=(t*40)%160;ctx.lineWidth=5;ctx.globalAlpha=a*0.8;ctx.strokeStyle=TH.accent2;ctx.beginPath();ctx.moveTo(-380,0);ctx.lineTo(380,0);ctx.stroke();
  ctx.strokeStyle=TH.accent;for(let i=0;i<3;i++){const x0=-420+i*320-sh;ctx.beginPath();ctx.moveTo(x0,0);ctx.quadraticCurveTo(x0+60,-110,x0+140,-110);ctx.lineTo(x0+200,-110);ctx.quadraticCurveTo(x0+280,-110,x0+300,0);ctx.stroke();
    for(let k=0;k<3;k++){ctx.fillStyle=TH.accent;ctx.beginPath();ctx.arc(x0+120+k*50,-110,10,0,6.28);ctx.fill();}
    ctx.fillStyle=hexA(TH.bg[1],0.95);ctx.strokeStyle='#5EE39A';ctx.lineWidth=2.5;rrect(x0+90,-190,180,44,10);ctx.fill();ctx.stroke();ctx.fillStyle='#5EE39A';ctx.font='700 16px Inter,sans-serif';ctx.textAlign='center';ctx.fillText('PR  plan ok  review ok',x0+180,-162);ctx.lineWidth=5;}
  for(let x=-380;x<=380;x+=80){ctx.fillStyle=TH.accent2;ctx.beginPath();ctx.arc(x,0,11,0,6.28);ctx.fill();}
  ctx.fillStyle='#fff';ctx.font='700 18px Inter,sans-serif';ctx.textAlign='left';ctx.fillText('main (protected)',-380,40);
  const k=(t*0.6)%1;ctx.globalAlpha=a*(1-k);ctx.strokeStyle='#5EE39A';ctx.lineWidth=3;ctx.beginPath();ctx.arc(300,0,14+k*40,0,6.28);ctx.stroke();
  ctx.restore();}

const MOTIFS={network:(t,a,b)=>mNetwork(t,a),shield:mShield,radar:mRadar,globe:mGlobe,code:mCode,blueprint:mBlueprint,lock:mLock,stack:mStack,docs:mDocs,invoice:mInvoice,pulse:mPulse,diff:mDiff,route:mRoute,fabric:mFabric,gitgraph:mGit};
function drawBg(t,netAlpha,big){ctx.clearRect(0,0,1920,1080);drawStars(t);ctx.save();if(TH.motif!=='network'){if(big)ctx.translate(80,0);else{ctx.translate(40,230);netAlpha*=0.6;}}(MOTIFS[TH.motif]||mNetwork)(t,netAlpha,big);ctx.restore();}
// ---------- hub graph (hook visual) ----------
function hubSvg(){const g=[];const cx=1430,cy=430;for(let i=0;i<10;i++){const a=i/10*6.283,r=200+(i%3)*45,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;const c=['#6D8CFF','#F59E0B','#38D9A9'][i%3];g.push(`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${c}" stroke-width="2.5" opacity=".8"/><circle cx="${x}" cy="${y}" r="13" fill="${c}"/>`);}
  return `<svg width="1920" height="1080" style="position:absolute;inset:0">${g.join('')}<circle cx="${cx}" cy="${cy}" r="62" fill="#1b2560" stroke="#8FA6FF" stroke-width="3"/><g transform="translate(${cx-22},${cy-22}) scale(1.85)">${DATA.icons.claude}</g></svg>`;}
function hexSvg(icon,color){return `<svg viewBox="0 0 260 290" width="260" height="290"><polygon points="130,8 248,75 248,215 130,282 12,215 12,75" fill="rgba(255,255,255,.10)" stroke="${TH.accent}" stroke-width="5"/><circle cx="130" cy="20" r="11" fill="${TH.accent}"/><circle cx="248" cy="215" r="11" fill="${TH.accent}"/><circle cx="12" cy="215" r="11" fill="${TH.accent}"/><g transform="translate(78,93) scale(4.4)" style="color:${color||'#fff'}">${icon}</g></svg>`;}
// ---------- panel rendering with typing ----------
function colorLine(l){const e=esc(l);if(l.startsWith('+'))return `<span class="add">${e}</span>`;if(l.startsWith('-'))return `<span class="del">${e}</span>`;if(l.startsWith('$'))return `<span class="cmd">${e}</span>`;if(l.startsWith('?')||/BLOCKED|FAIL|UNKNOWN|rejected|REVIEW|hold|reopened|GAP|MORE EVIDENCE/.test(l))return `<span class="warn">${e}</span>`;if(/APPROVED|VALIDATED|ok|passed|shortlist|FIXED|allowed|blocked\b/.test(l)&&!l.startsWith('>'))return `<span class="ok">${e}</span>`;if(l.startsWith('>'))return `<span>${e}</span>`;return `<span class="dim">${e}</span>`;}
function panelHtml(kind,lines){const dots='<i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>';const title={terminal:'claude - agent session',diff:'review - pull request',cards:'workflow - results'}[kind]||'';return `<div class="bar">${dots}<span style="color:#7E8BB0;font-size:18px;margin-left:10px">${title}</span></div><pre></pre>`;}
function typePanel(pre,lines,t,s,cps=55){let total=0;const out=[];let done=true;for(const l of lines){const start=s+total/cps;const n=clamp(Math.floor((t-start)*cps),0,l.length);total+=l.length+18;if(n<=0){done=false;break;}out.push(colorLine(l.slice(0,n)));if(n<l.length){done=false;break;}}
  pre.innerHTML=out.join('\n')+(done?'':'<span class="cursor"></span>');}
// ---------- build scenes ----------
const L=document.getElementById('layers');
const scenes={};
function layer(id){const d=el('div','layer');d.id='L_'+id;L.appendChild(d);scenes[id]=d;return d;}

{const d=layer('hook');d.innerHTML=TH.motif==='network'?hubSvg():'';const w=el('div');w.style.cssText='position:absolute;left:110px;top:150px;width:1080px';w.innerHTML=`<div class="badge" id="hk_b">New course</div><div class="h1" id="hk_t" style="margin-top:34px">${esc(DATA.hook_title)}</div><div class="h2" id="hk_s" style="margin-top:26px">${esc(DATA.hook_sub)}</div><div class="q" id="hk_q" style="margin-top:46px">${esc(DATA.hook_q)}</div>`;d.appendChild(w);}

{const d=layer('intro');d.innerHTML=`<img id="in_l" src="logo-dark.png" style="position:absolute;left:610px;top:150px;height:170px"><div style="position:absolute;left:0;right:0;top:380px;text-align:center"><div class="badge" id="in_b" style="font-size:26px">${DATA.days}-day hands-on course</div><div class="h1" id="in_n" style="margin-top:34px;font-size:100px;padding:0 160px">${esc(DATA.title)}</div><div class="h2" id="in_t" style="margin-top:26px;font-size:42px;color:var(--ac);font-weight:600">${esc(DATA.tagline)}</div></div><div class="hex" id="in_h" style="left:830px;top:800px;transform-origin:center;width:200px;height:220px">${hexSvg(DATA.icons.claude,'#fff')}</div>`;}
// story
{const d=layer('story');d.innerHTML=`<div style="position:absolute;left:110px;top:150px;width:1200px"><div class="badge" id="st_b">The story</div><div class="h1" id="st_t" style="margin-top:34px">${esc(DATA.story_big)}</div><div id="st_n" style="margin-top:40px;display:flex;align-items:baseline;gap:26px"><span class="big">${esc(DATA.story_num)}</span><span class="q" style="font-size:74px">${esc(DATA.story_num_label)}</span></div><div class="h2" id="st_s" style="margin-top:36px;width:1100px">${esc(DATA.story_sub)}</div></div><div class="hex" id="st_h" style="left:1460px;top:330px">${hexSvg(DATA.icons.capstone,'#fff')}</div>`;}
// paths
DATA.paths.forEach((p,i)=>{const d=layer('path'+i);const items=p.items.map(([a,b],k)=>`<div class="item" id="p${i}_i${k}"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('');d.innerHTML=`<div class="card" id="p${i}_c" style="left:90px;top:150px;width:720px;min-height:760px;padding:40px 44px"><div class="badge">Learning path ${i+1} of ${DATA.paths.length}</div><div class="h1" style="font-size:86px;margin-top:26px">${esc(p.name)}</div><div style="margin-top:20px">${items}</div></div><div class="panel" id="p${i}_p" style="left:880px;top:190px;width:960px;height:680px">${panelHtml(p.panel,p.panel_lines)}</div>`;});
// labs montage
{const d=layer('labs');const ps=DATA.paths.slice(0,3);d.innerHTML=`<div style="position:absolute;left:110px;top:120px"><div class="badge" id="lb_b">Hands-on labs</div><div class="h1" id="lb_t" style="margin-top:30px;font-size:84px">Every lab, hands-on.\nBreak it. Fix it. Roll it back.</div></div>`+ps.map((p,i)=>`<div class="panel" id="lb_p${i}" style="left:${110+i*590}px;top:470px;width:560px;height:480px;transform-origin:center">${panelHtml(p.panel,p.panel_lines)}</div>`).join('');}
// stats
{const d=layer('stats');d.innerHTML=`<div style="position:absolute;left:110px;top:120px"><div class="badge" id="sx_b">At a glance</div><div class="h1" id="sx_t" style="margin-top:30px;font-size:84px">Every outcome,\nby the numbers</div></div>`+DATA.stats.map(([n,l],i)=>`<div class="stat" id="sx_${i}" style="left:760px;top:${150+i*200}px"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join('');}
// who + tools
{const d=layer('who');const tools=DATA.tools.map(([svg,label],i)=>`<div class="tool" id="wh_t${i}" data-i="${i}">${svg}<span>${esc(label)}</span></div>`).join('');d.innerHTML=`<div style="position:absolute;left:110px;top:120px;width:1700px"><div class="badge" id="wh_b">Who should attend</div><div class="h1" id="wh_t" style="margin-top:26px;font-size:54px;line-height:1.15">${esc(DATA.audience_short)}</div><div class="h2" id="wh_s" style="margin-top:22px;font-size:28px;width:1500px">${esc(DATA.prereq_short)}</div></div><div id="wh_tools" style="position:absolute;left:110px;top:700px;width:1700px;height:330px">${tools}</div>`;}
// modules sweep (used in labs/outro area) - list of modules as cards
const MPAGE=Math.ceil(DATA.modules.length/Math.ceil(DATA.modules.length/10));
{const d=layer('mods');d.innerHTML=`<div style="position:absolute;left:110px;top:80px"><div class="badge" id="md_b">Table of contents</div><div class="h1" id="md_t" style="margin-top:18px;font-size:64px">${DATA.days} days. ${DATA.modules.length} modules.</div></div>`+DATA.modules.map((m,i)=>{const k=i%MPAGE;return `<div class="mod" id="md_${i}" style="left:${110+(k%2)*880}px;top:${265+Math.floor(k/2)*140}px;padding:12px 22px"><div class="ic" style="width:58px;height:58px">${m.icon}</div><div><small style="font-size:18px">Module ${i+1} &middot; Day ${m.day}</small><b style="font-size:26px">${esc(m.title)}</b></div></div>`;}).join('');}

{const d=layer('princ');d.innerHTML=`<div style="position:absolute;left:110px;top:110px"><div class="badge" id="pr_b">Engineering principles</div><div class="h1" id="pr_t" style="margin-top:26px;font-size:76px">Six rules every\nbuild follows</div></div>`+DATA.principles.map(([a,b],i)=>`<div class="mod" id="pr_${i}" style="left:${110+(i%2)*880}px;top:${430+Math.floor(i/2)*190}px;width:840px"><div class="ic">${DATA.icons.capstone}</div><div><b>${esc(a)}</b><small style="text-transform:none;letter-spacing:0;font-size:24px;margin-top:4px">${esc(b)}</small></div></div>`).join('');}

{const d=layer('cta');d.innerHTML=`<img id="ct_l" src="logo-dark.png" style="position:absolute;left:560px;top:150px;height:190px"><div class="hex" id="ct_h" style="left:830px;top:390px">${hexSvg(DATA.icons.capstone,'#fff')}</div><div style="position:absolute;left:0;right:0;top:720px;text-align:center"><div class="q" id="ct_q" style="font-size:54px">${esc(DATA.cta)}</div><div class="h2" id="ct_c" style="margin-top:22px;font-size:40px;color:#fff;font-weight:700">${esc(DATA.title)}</div><div class="h2" id="ct_u" style="margin-top:14px;font-size:38px;color:var(--ac);font-weight:700">Enrol now at gennoor.com</div></div>`;}
// ---------- timeline ----------
const T=DATA.timeline; // [{id, start, end}]
const g=id=>document.getElementById(id);
function showOnly(id){for(const k in scenes)scenes[k].style.opacity=(k===id)?1:0;}
function sceneAt(t){for(const s of T)if(t>=s.start&&t<s.end)return s;return T[T.length-1];}
function fadeEdge(t,s){const a=tw(t,s.start,0.5);const b=1-tw(t,s.end-0.5,0.5,easeIn);return Math.min(a,b);}
window.seek=function(t){
  const s=sceneAt(t);const r=t-s.start;const id=s.id;
  showOnly(id);const lay=scenes[id];lay.style.opacity=fadeEdge(t,s);
  drawBg(t, id==='hook'?(TH.motif==='network'?0.35:0.95):(id==='cta'||id==='intro'?0.75:0.3), id==='hook');
  g('logo').style.opacity=(id==='cta')?0:1;
  if(id==='hook'){rise(g('hk_b'),r,0.2);rise(g('hk_t'),r,0.5);rise(g('hk_s'),r,1.3);rise(g('hk_q'),r,s.cue||4.5);}
  else if(id==='intro'){pop(g('in_l'),r,0.1);rise(g('in_b'),r,0.5);rise(g('in_n'),r,0.9);rise(g('in_t'),r,1.6);pop(g('in_h'),r,2.0);g('in_h').style.transform+=` rotate(${Math.sin(t*0.8)*5}deg)`;}
  else if(id==='story'){rise(g('st_b'),r,0.2);rise(g('st_t'),r,0.5);pop(g('st_n'),r,1.6);rise(g('st_s'),r,2.6);pop(g('st_h'),r,0.8);g('st_h').style.transform+=` rotate(${Math.sin(t*0.8)*4}deg)`;}
  else if(id.startsWith('path')){const i=+id.slice(4);slideX(g(`p${i}_c`),r,0.1,0.7,-80);DATA.paths[i].items.forEach((_,k)=>rise(g(`p${i}_i${k}`),r,0.9+k*(s.itemGap||1.4)));slideX(g(`p${i}_p`),r,0.5,0.8,120);typePanel(g(`p${i}_p`).querySelector('pre'),DATA.paths[i].panel_lines,r,1.4,s.cps||48);}
  else if(id==='labs'){rise(g('lb_b'),r,0.2);rise(g('lb_t'),r,0.5);[0,1,2].forEach(i=>{const p=g('lb_p'+i);pop(p,r,1.2+i*0.6);p.style.transform+=` translateY(${Math.sin(t*1.1+i)*8}px)`;typePanel(p.querySelector('pre'),DATA.paths[i].panel_lines.slice(0,6),r,1.6+i*0.6,70);});}
  else if(id==='mods'){rise(g('md_b'),r,0.2);rise(g('md_t'),r,0.5);const per=(s.end-s.start-1.5)/Math.ceil(DATA.modules.length/MPAGE);DATA.modules.forEach((m,i)=>{const page=Math.floor(i/MPAGE);const st=1.2+page*per;const en=st+per;const e=g('md_'+i);if(r<st||r>=en){e.style.opacity=0;return;}const a=tw(r,st+(i%MPAGE)*0.12,0.5);const b=1-tw(r,en-0.4,0.4,easeIn);e.style.opacity=Math.min(a,b);e.style.transform=`translateY(${(1-a)*30}px)`;});}
  else if(id==='princ'){rise(g('pr_b'),r,0.2);rise(g('pr_t'),r,0.5);DATA.principles.forEach((_,i)=>rise(g('pr_'+i),r,1.2+i*(s.itemGap||1.5)));}
  else if(id==='stats'){rise(g('sx_b'),r,0.2);rise(g('sx_t'),r,0.5);DATA.stats.forEach((_,i)=>slideX(g('sx_'+i),r,1.0+i*(s.itemGap||1.6),0.7,120));}
  else if(id==='who'){rise(g('wh_b'),r,0.2);rise(g('wh_t'),r,0.5);rise(g('wh_s'),r,1.4);const tools=[...document.querySelectorAll('#wh_tools .tool')];let x=0,y=0;tools.forEach((e,i)=>{if(x+e.offsetWidth>1700){x=0;y+=100;}e.style.left=x+'px';e.style.top=y+'px';x+=e.offsetWidth+18;const p=tw(r,2.2+i*0.18,0.5);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*30}px)`;});}
  else if(id==='cta'){pop(g('ct_l'),r,0.2);pop(g('ct_h'),r,0.6);g('ct_h').style.transform+=` rotate(${Math.sin(t*0.8)*5}deg)`;rise(g('ct_q'),r,1.2);rise(g('ct_c'),r,2.0);rise(g('ct_u'),r,s.cue||4.0);}
  // captions
  let c='';for(const k of DATA.captions){if(t>=k.s&&t<k.e){c=k.text;break;}}
  g('captxt').textContent=c;g('cap').style.opacity=c?1:0;
};
