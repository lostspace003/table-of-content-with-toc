<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070b24;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff}
:root{--ac:#F59E0B;--ac2:#6D8CFF}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 800px at 25% 20%,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
canvas#bg{position:absolute;inset:0}
.layer{position:absolute;inset:0;opacity:0}
.logo{position:absolute;top:30px;right:50px;height:84px}
.badge{display:inline-block;background:var(--ac);color:#101010;font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px;border-radius:8px}
.h1{font-size:92px;font-weight:800;line-height:1.08;letter-spacing:-.025em;white-space:pre-line;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.h2{font-size:40px;color:#C7D2EA;font-weight:500;line-height:1.3;white-space:pre-line}
.q{font-size:60px;font-weight:800;color:var(--ac);line-height:1.15;white-space:pre-line;letter-spacing:-.02em}
.big{font-size:150px;font-weight:800;color:var(--ac);letter-spacing:-.03em;line-height:1}
.card{position:absolute;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.item{position:relative;padding-left:26px;margin-top:34px}
.item:before{content:"";position:absolute;left:0;top:6px;width:7px;height:52px;background:var(--ac);border-radius:4px}
.item b{display:block;font-size:40px;font-weight:700;line-height:1.1}
.item span{display:block;font-size:26px;color:#AEB9D6;margin-top:6px}
.panel{position:absolute;background:#0b0f1f;border:2px solid rgba(140,160,230,.5);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.panel .bar{height:44px;background:#141a33;display:flex;align-items:center;gap:10px;padding-left:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel .bar i{width:14px;height:14px;border-radius:50%;display:inline-block}
.panel pre{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:21px;line-height:1.55;padding:22px 26px;color:#D8E0F5;white-space:pre-wrap;word-break:normal;overflow-wrap:normal}
.panel pre .add{color:#5EE39A}.panel pre .del{color:#FF7B7B}.panel pre .cmd{color:#FFD56B}.panel pre .ok{color:#5EE39A}.panel pre .warn{color:#FFB454}.panel pre .dim{color:#7E8BB0}
.cursor{display:inline-block;width:14px;height:28px;background:var(--ac);vertical-align:-4px;margin-left:2px}
.cap{position:absolute;left:0;right:0;bottom:46px;text-align:center}
.cap span{display:inline-block;background:rgba(0,0,0,.72);color:#fff;font-size:36px;font-weight:500;padding:12px 28px;border-radius:14px;max-width:1500px;line-height:1.35}
.photo{position:absolute;width:420px;height:420px;border-radius:50%;border:10px solid var(--ac);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.hex{position:absolute;width:260px;height:290px}
.stat{position:absolute;left:0;width:1100px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:22px;padding:22px 30px;display:flex;align-items:center;gap:28px}
.stat .n{font-size:84px;font-weight:800;color:var(--ac);min-width:230px;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:36px;font-weight:600;line-height:1.2}
.tool{position:absolute;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 26px;font-size:30px;font-weight:600;white-space:nowrap}
.tool svg{width:44px;height:44px}
.mod{position:absolute;display:flex;align-items:center;gap:20px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:20px;padding:18px 26px;width:860px}
.mod .ic{width:68px;height:68px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.mod .ic svg{width:40px;height:40px}
.mod b{font-size:30px;font-weight:700;line-height:1.15;display:block}
.mod small{font-size:22px;color:#AEB9D6;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<img class="logo" id="logo" src="logo-dark.png">
<div id="layers"></div>
<div class="cap" id="cap"><span id="captxt"></span></div>
</div>

75-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z\"/></svg>", "capstone": "<svg class=\"\" width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" role=\"img\" aria-label=\"capstone\" style=\"color:#fff\"><path d=\"M12 3l9 5-9 5-9-5z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M5 11v4c0 2 3.5 4 7 4s7-2 7-4v-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg>"}, "timeline": [{"id": "hook", "start": 0.0, "end": 26.58, "cue": 11.43}, {"id": "intro", "start": 26.58, "end": 31.554}, {"id": "story", "start": 31.554, "end": 58.104}, {"id": "path0", "start": 58.104, "end": 121.812, "cue": 28.782, "itemGap": 15.177, "cps": 35}, {"id": "path1", "start": 121.812, "end": 155.49, "itemGap": 10.226, "cps": 35}, {"id": "path2", "start": 155.49, "end": 206.64, "itemGap": 16.05, "cps": 35}, {"id": "path3", "start": 206.64, "end": 242.58, "cue": 18.894, "itemGap": 8.235, "cps": 35}, {"id": "labs", "start": 242.58, "end": 258.426}, {"id": "mods", "start": 258.426, "end": 309.6}, {"id": "princ", "start": 309.6, "end": 329.862, "itemGap": 2.466}, {"id": "stats", "start": 329.862, "end": 338.7, "itemGap": 1.168}, {"id": "who", "start": 338.7, "end": 362.61}, {"id": "cta", "start": 362.61, "end": 377.144}], "captions": [{"s": 1.2, "e": 3.431, "text": "The certificate expired at midnight."}, {"s": 3.431, "e": 6.405, "text": "Nobody knew it was bound to the payments virtual"}, {"s": 6.405, "e": 9.007, "text": "server. By the time the first alert fired,"}, {"s": 9.007, "e": 10.68, "text": "the queue was already full."}, {"s": 11.43, "e": 14.135, "text": "What if an agent had found it weeks earlier,"}, {"s": 14.135, "e": 17.516, "text": "planned the renewal across every load balancer you own,"}, {"s": 17.516, "e": 20.897, "text": "opened the change ticket, then waited for your approval"}, {"s": 20.897, "e": 22.864, "text": "before touching a single device?"}, {"s": 22.864, "e": 25.692, "text": "That is certificate renewal, done with Claude,"}, {"s": 25.692, "e": 26.43, "text": "done safely."}, {"s": 27.18, "e": 31.404, "text": "Gennoor Tech presents Certificate Renewal Automation with Claude."}, {"s": 32.154, "e": 34.897, "text": "Every platform. One renewal pipeline."}, {"s": 34.897, "e": 38.456, "text": "F5, NetScaler, Radware and other load balancers,"}, {"s": 38.456, "e": 41.94, "text": "handled by one plan, one approval and one audit"}, {"s": 41.94, "e": 45.721, "text": "trail. You build it in nine increments across three"}, {"s": 45.721, "e": 48.464, "text": "days, each one something you can run,"}, {"s": 48.464, "e": 51.207, "text": "review and demonstrate. Claude plans,"}, {"s": 51.207, "e": 54.988, "text": "drafts and explains. Deterministic Python executes."}, {"s": 54.988, "e": 57.954, "text": "A person approves. Everything is logged."}, {"s": 58.704, "e": 62.194, "text": "You start with the certificate lifecycle as a load"}, {"s": 62.194, "e": 65.545, "text": "balancer actually sees it. Client S S L profiles"}, {"s": 65.545, "e": 67.359, "text": "and virtual servers on F5."}, {"s": 67.359, "e": 70.361, "text": "Cert-key objects and bindings on NetScaler."}, {"s": 70.361, "e": 74.13, "text": "Certificate repositories and S S L policies on Radware"}, {"s": 74.13, "e": 77.062, "text": "Alteon. You renew one certificate by hand,"}, {"s": 77.062, "e": 80.482, "text": "write down every step, and mark every point where"}, {"s": 80.482, "e": 83.553, "text": "a wrong chain, a mismatched key or a skipped"}, {"s": 83.553, "e": 86.136, "text": "H A sync would have caused an outage."}, {"s": 86.886, "e": 89.175, "text": "Then you set up your workbench."}, {"s": 89.175, "e": 92.645, "text": "Claude Code with a project file that knows your"}, {"s": 92.645, "e": 94.639, "text": "naming rules and red lines."}, {"s": 94.639, "e": 97.813, "text": "The Claude Agent S D K running Python tools"}, {"s": 97.813, "e": 100.176, "text": "with structured J S O N outputs."}, {"s": 100.176, "e": 103.72, "text": "An M C P server that exposes read-only inventory"}, {"s": 103.72, "e": 106.304, "text": "calls and nothing else. After that,"}, {"s": 106.304, "e": 109.405, "text": "a discovery agent pulls every certificate,"}, {"s": 109.405, "e": 112.802, "text": "expiry date and binding from F5 iControl REST,"}, {"s": 112.802, "e": 114.722, "text": "the NetScaler NITRO A P I,"}, {"s": 114.722, "e": 117.38, "text": "the Radware Alteon REST A P I and an"}, {"s": 117.38, "e": 119.816, "text": "adapter for other load balancers,"}, {"s": 119.816, "e": 121.662, "text": "into one typed inventory."}, {"s": 122.412, "e": 125.008, "text": "On day two the planning agent arrives."}, {"s": 125.008, "e": 129.175, "text": "It reads the inventory, groups certificates by expiry window,"}, {"s": 129.175, "e": 132.523, "text": "owner and blast radius, and drafts a renewal plan"}, {"s": 132.523, "e": 134.026, "text": "as structured J S O N."}, {"s": 134.026, "e": 136.758, "text": "It must cite the inventory rows it used;"}, {"s": 136.758, "e": 140.242, "text": "a missing owner or an unverified binding blocks the"}, {"s": 140.242, "e": 142.36, "text": "plan rather than being guessed."}, {"s": 142.36, "e": 146.049, "text": "Then it opens the change record through the ServiceNow"}, {"s": 146.049, "e": 148.03, "text": "Table A P I and hands it to a"}, {"s": 148.03, "e": 150.831, "text": "Flow Designer approval path. The C S R is"}, {"s": 150.831, "e": 154.042, "text": "generated by code, and the private key is never"}, {"s": 154.042, "e": 155.34, "text": "shown to the model."}, {"s": 156.09, "e": 160.619, "text": "Then the executors. Deterministic, tested Python that uploads,"}, {"s": 160.619, "e": 164.417, "text": "installs and binds the certificate on each platform."}, {"s": 164.417, "e": 166.973, "text": "On F5 that is iControl REST and t m"}, {"s": 166.973, "e": 169.457, "text": "s h. On NetScaler, the NITRO A P I"}, {"s": 169.457, "e": 172.671, "text": "with primary-only writes and a saved config."}, {"s": 172.671, "e": 175.447, "text": "On Radware, the Alteon REST A P I with"}, {"s": 175.447, "e": 177.857, "text": "apply and save as explicit steps."}, {"s": 177.857, "e": 181.728, "text": "For other load balancers you build an adapter against"}, {"s": 181.728, "e": 185.527, "text": "the same contract. Claude writes the first draft and"}, {"s": 185.527, "e": 189.836, "text": "explains every call. Then pytest proves it against recorded"}, {"s": 189.836, "e": 193.05, "text": "device responses before it touches hardware."}, {"s": 193.05, "e": 195.753, "text": "On day three the guardrails close in:"}, {"s": 195.753, "e": 199.186, "text": "an approved change, an open maintenance window,"}, {"s": 199.186, "e": 201.158, "text": "a device on the allow list,"}, {"s": 201.158, "e": 203.568, "text": "H A in sync. Miss any one and the"}, {"s": 203.568, "e": 206.49, "text": "install is refused with a logged reason."}, {"s": 207.24, "e": 210.324, "text": "Validation comes next. A T L S handshake test"}, {"s": 210.324, "e": 213.134, "text": "on every virtual server before and after."}, {"s": 213.134, "e": 215.532, "text": "Chain, key match and serial checks."}, {"s": 215.532, "e": 219.027, "text": "If the post-check fails, the executor rolls back to"}, {"s": 219.027, "e": 222.18, "text": "the previous certificate object automatically,"}, {"s": 222.18, "e": 224.784, "text": "and you will watch it do exactly that."}, {"s": 225.534, "e": 228.535, "text": "Finally you wire the whole thing into a GitHub"}, {"s": 228.535, "e": 231.014, "text": "pull request and a GitHub Actions run,"}, {"s": 231.014, "e": 233.884, "text": "so every renewal plan is reviewed like code,"}, {"s": 233.884, "e": 237.211, "text": "with tests, dry run and post-check report attached."}, {"s": 237.211, "e": 240.995, "text": "Renewals are scheduled ahead of expiry and the certificate"}, {"s": 240.995, "e": 242.43, "text": "owner gets the report."}, {"s": 243.18, "e": 245.382, "text": "Every lab runs against lab devices,"}, {"s": 245.382, "e": 248.275, "text": "a lab certificate authority and recorded A P I"}, {"s": 248.275, "e": 250.917, "text": "responses, so you can break things safely."}, {"s": 250.917, "e": 253.559, "text": "You will watch a renewal get blocked for a"}, {"s": 253.559, "e": 256.263, "text": "missing approval, break a chain on purpose,"}, {"s": 256.263, "e": 258.276, "text": "and roll back against the clock."}, {"s": 259.026, "e": 261.633, "text": "Here is the full table of contents,"}, {"s": 261.633, "e": 263.569, "text": "9 modules over three days."}, {"s": 263.569, "e": 267.74, "text": "Day one: Certificate lifecycle on load balancers and the"}, {"s": 267.74, "e": 271.018, "text": "automation baseline; Setting up Claude Code,"}, {"s": 271.018, "e": 274.22, "text": "the Agent SDK and MCP for certificate work;"}, {"s": 274.22, "e": 278.987, "text": "and Certificate inventory and expiry discovery across platforms."}, {"s": 278.987, "e": 283.605, "text": "Day two: Renewal planning agent and ServiceNow change records;"}, {"s": 283.605, "e": 288.223, "text": "Deterministic executor: F5 BIG-IP with iControl REST and tmsh;"}, {"s": 288.223, "e": 291.574, "text": "and Deterministic executors: NetScaler NITRO,"}, {"s": 291.574, "e": 295.373, "text": "Radware Alteon and other load balancers (Anaya LB)."}, {"s": 295.373, "e": 300.363, "text": "Day three: Guardrails, approvals and audit for certificate changes;"}, {"s": 300.363, "e": 304.46, "text": "Pre- and post-checks, rollback and the GitHub pipeline;"}, {"s": 304.46, "e": 309.45, "text": "and Capstone: end-to-end certificate renewal across the lab estate."}, {"s": 310.2, "e": 314.372, "text": "Every build in this course follows six engineering principles."}, {"s": 314.372, "e": 316.188, "text": "Model output is a proposal,"}, {"s": 316.188, "e": 319.687, "text": "never a fact. Authorization lives outside the model."}, {"s": 319.687, "e": 322.647, "text": "A human approves every consequential action."}, {"s": 322.647, "e": 324.935, "text": "Decisions and evidence are logged."}, {"s": 324.935, "e": 328.905, "text": "The stack stays provider-agnostic. And quality is measured,"}, {"s": 328.905, "e": 329.712, "text": "not assumed."}, {"s": 330.462, "e": 333.346, "text": "Four load balancer platforms. Three days,"}, {"s": 333.346, "e": 337.917, "text": "hands-on. Nine build steps. And zero certificate installs without"}, {"s": 337.917, "e": 338.55, "text": "approval."}, {"s": 339.3, "e": 342.374, "text": "This course is for enterprise I T and network"}, {"s": 342.374, "e": 345.927, "text": "operations teams, load balancer and A D C engineers,"}, {"s": 345.927, "e": 347.908, "text": "P K I and certificate owners,"}, {"s": 347.908, "e": 351.529, "text": "and network automation leads, in India and worldwide."}, {"s": 351.529, "e": 354.74, "text": "You need working knowledge of at least one load"}, {"s": 354.74, "e": 358.019, "text": "balancer platform, T L S basics and some Python."}, {"s": 358.019, "e": 361.367, "text": "Experience with an A I coding assistant helps but"}, {"s": 361.367, "e": 362.46, "text": "is not required."}, {"s": 363.21, "e": 366.524, "text": "Never get paged for an expired certificate again."}, {"s": 366.524, "e": 369.433, "text": "Certificate Renewal Automation with Claude."}, {"s": 369.433, "e": 371.394, "text": "Enrol now at gennoor dot com."}], "theme": {"motif": "lock", "accent": "#FBBF24", "accent2": "#FDE68A", "bg": ["#4a3406", "#1f1708", "#0a0804"], "bed": 112}};

{const d=layer('princ');d.innerHTML=`<div style="position:absolute;left:110px;top:110px"><div class="badge" id="pr_b">Engineering principles</div><div class="h1" id="pr_t" style="margin-top:26px;font-size:76px">Six rules every\nbuild follows</div></div>`+DATA.principles.map(([a,b],i)=>`<div class="mod" id="pr_${i}" style="left:${110+(i%2)*880}px;top:${430+Math.floor(i/2)*190}px;width:840px"><div class="ic">${DATA.icons.capstone}</div><div><b>${esc(a)}</b><small style="text-transform:none;letter-spacing:0;font-size:24px;margin-top:4px">${esc(b)}</small></div></div>`).join('');}
// cta
{const d=layer('cta');d.innerHTML=`<img id="ct_l" src="logo-dark.png" style="position:absolute;left:560px;top:150px;height:190px"><div class="hex" id="ct_h" style="left:830px;top:390px">${hexSvg(DATA.icons.capstone,'#fff')}</div><div style="position:absolute;left:0;right:0;top:720px;text-align:center"><div class="q" id="ct_q" style="font-size:54px">${esc(DATA.cta)}</div><div class="h2" id="ct_c" style="margin-top:22px;font-size:40px;color:#fff;font-weight:700">${esc(DATA.title)}</div><div class="h2" id="ct_u" style="margin-top:14px;font-size:38px;color:var(--ac);font-weight:700">Enrol now at gennoor.com</div></div>`;}
// ---------- timeline ----------
const T=DATA.timeline; // [{id, start, end}]
const g=id=>document.getElementById(id);
function showOnly(id){for(const k in scenes)scenes[k].style.opacity=(k===id)?1:0;}
function sceneAt(t){for(const s of T)if(t>=s.start&&t<s.end)return s;return T[T.length-1];}
function fadeEdge(t,s){const a=tw(t,s.start,0.5);const b=1-tw(t,s.end-0.5,0.5,easeIn);return Math.min(a,b);}
window.seek=function(t){
  const s=sceneAt(t);const r=t-s.start;const id=s.id;
  showOnly(id);const lay=scenes[id];lay.style.opacity=fadeEdge(t,s);
  drawBg(t, id==='hook'?(TH.motif==='network'?0.35:0.95):(id==='cta'||id==='intro'?0.75:0.3), id==='hook');
  g('logo').style.opacity=(id==='cta')?0:1;
  if(id==='hook'){rise(g('hk_b'),r,0.2);rise(g('hk_t'),r,0.5);rise(g('hk_s'),r,1.3);rise(g('hk_q'),r,s.cue||4.5);}
  else if(id==='intro'){pop(g('in_l'),r,0.1);rise(g('in_b'),r,0.5);rise(g('in_n'),r,0.9);rise(g('in_t'),r,1.6);pop(g('in_h'),r,2.0);g('in_h').style.transform+=` rotate(${Math.sin(t*0.8)*5}deg)`;}
  else if(id==='story'){rise(g('st_b'),r,0.2);rise(g('st_t'),r,0.5);pop(g('st_n'),r,1.6);rise(g('st_s'),r,2.6);pop(g('st_h'),r,0.8);g('st_h').style.transform+=` rotate(${Math.sin(t*0.8)*4}deg)`;}
  else if(id.startsWith('path')){const i=+id.slice(4);slideX(g(`p${i}_c`),r,0.1,0.7,-80);DATA.paths[i].items.forEach((_,k)=>rise(g(`p${i}_i${k}`),r,0.9+k*(s.itemGap||1.4)));slideX(g(`p${i}_p`),r,0.5,0.8,120);typePanel(g(`p${i}_p`).querySelector('pre'),DATA.paths[i].panel_lines,r,1.4,s.cps||48);}
  else if(id==='labs'){rise(g('lb_b'),r,0.2);rise(g('lb_t'),r,0.5);[0,1,2].forEach(i=>{const p=g('lb_p'+i);pop(p,r,1.2+i*0.6);p.style.transform+=` translateY(${Math.sin(t*1.1+i)*8}px)`;typePanel(p.querySelector('pre'),DATA.paths[i].panel_lines.slice(0,6),r,1.6+i*0.6,70);});}
  else if(id==='mods'){rise(g('md_b'),r,0.2);rise(g('md_t'),r,0.5);const per=(s.end-s.start-1.5)/Math.ceil(DATA.modules.length/MPAGE);DATA.modules.forEach((m,i)=>{const page=Math.floor(i/MPAGE);const st=1.2+page*per;const en=st+per;const e=g('md_'+i);if(r<st||r>=en){e.style.opacity=0;return;}const a=tw(r,st+(i%MPAGE)*0.12,0.5);const b=1-tw(r,en-0.4,0.4,easeIn);e.style.opacity=Math.min(a,b);e.style.transform=`translateY(${(1-a)*30}px)`;});}
  else if(id==='princ'){rise(g('pr_b'),r,0.2);rise(g('pr_t'),r,0.5);DATA.principles.forEach((_,i)=>rise(g('pr_'+i),r,1.2+i*(s.itemGap||1.5)));}
  else if(id==='stats'){rise(g('sx_b'),r,0.2);rise(g('sx_t'),r,0.5);DATA.stats.forEach((_,i)=>slideX(g('sx_'+i),r,1.0+i*(s.itemGap||1.6),0.7,120));}
  else if(id==='who'){rise(g('wh_b'),r,0.2);rise(g('wh_t'),r,0.5);rise(g('wh_s'),r,1.4);const tools=[...document.querySelectorAll('#wh_tools .tool')];let x=0,y=0;tools.forEach((e,i)=>{if(x+e.offsetWidth>1700){x=0;y+=100;}e.style.left=x+'px';e.style.top=y+'px';x+=e.offsetWidth+18;const p=tw(r,2.2+i*0.18,0.5);e.style.opacity=p;e.style.transform=`translateY(${(1-p)*30}px)`;});}
  else if(id==='cta'){pop(g('ct_l'),r,0.2);pop(g('ct_h'),r,0.6);g('ct_h').style.transform+=` rotate(${Math.sin(t*0.8)*5}deg)`;rise(g('ct_q'),r,1.2);rise(g('ct_c'),r,2.0);rise(g('ct_u'),r,s.cue||4.0);}
  // captions
  let c='';for(const k of DATA.captions){if(t>=k.s&&t<k.e){c=k.text;break;}}
  g('captxt').textContent=c;g('cap').style.opacity=c?1:0;
};
</script></body></html>
