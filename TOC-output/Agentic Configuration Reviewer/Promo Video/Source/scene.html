<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#070b24;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;color:#fff}
:root{--ac:#F59E0B;--ac2:#6D8CFF}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(1200px 800px at 25% 20%,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%)}
canvas#bg{position:absolute;inset:0}
.layer{position:absolute;inset:0;opacity:0}
.logo{position:absolute;top:30px;right:50px;height:84px}
.badge{display:inline-block;background:var(--ac);color:#101010;font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;padding:9px 18px;border-radius:8px}
.h1{font-size:92px;font-weight:800;line-height:1.08;letter-spacing:-.025em;white-space:pre-line;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.h2{font-size:40px;color:#C7D2EA;font-weight:500;line-height:1.3;white-space:pre-line}
.q{font-size:60px;font-weight:800;color:var(--ac);line-height:1.15;white-space:pre-line;letter-spacing:-.02em}
.big{font-size:150px;font-weight:800;color:var(--ac);letter-spacing:-.03em;line-height:1}
.card{position:absolute;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.45);backdrop-filter:blur(6px)}
.item{position:relative;padding-left:26px;margin-top:34px}
.item:before{content:"";position:absolute;left:0;top:6px;width:7px;height:52px;background:var(--ac);border-radius:4px}
.item b{display:block;font-size:40px;font-weight:700;line-height:1.1}
.item span{display:block;font-size:26px;color:#AEB9D6;margin-top:6px}
.panel{position:absolute;background:#0b0f1f;border:2px solid rgba(140,160,230,.5);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden}
.panel .bar{height:44px;background:#141a33;display:flex;align-items:center;gap:10px;padding-left:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel .bar i{width:14px;height:14px;border-radius:50%;display:inline-block}
.panel pre{font-family:"DejaVu Sans Mono",Consolas,monospace;font-size:21px;line-height:1.55;padding:22px 26px;color:#D8E0F5;white-space:pre-wrap;word-break:normal;overflow-wrap:normal}
.panel pre .add{color:#5EE39A}.panel pre .del{color:#FF7B7B}.panel pre .cmd{color:#FFD56B}.panel pre .ok{color:#5EE39A}.panel pre .warn{color:#FFB454}.panel pre .dim{color:#7E8BB0}
.cursor{display:inline-block;width:14px;height:28px;background:var(--ac);vertical-align:-4px;margin-left:2px}
.cap{position:absolute;left:0;right:0;bottom:46px;text-align:center}
.cap span{display:inline-block;background:rgba(0,0,0,.72);color:#fff;font-size:36px;font-weight:500;padding:12px 28px;border-radius:14px;max-width:1500px;line-height:1.35}
.photo{position:absolute;width:420px;height:420px;border-radius:50%;border:10px solid var(--ac);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.hex{position:absolute;width:260px;height:290px}
.stat{position:absolute;left:0;width:1100px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:22px;padding:22px 30px;display:flex;align-items:center;gap:28px}
.stat .n{font-size:84px;font-weight:800;color:var(--ac);min-width:230px;letter-spacing:-.03em;line-height:1}
.stat .l{font-size:36px;font-weight:600;line-height:1.2}
.tool{position:absolute;display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.14);border-radius:18px;padding:16px 26px;font-size:30px;font-weight:600;white-space:nowrap}
.tool svg{width:44px;height:44px}
.mod{position:absolute;display:flex;align-items:center;gap:20px;background:rgba(10,16,48,.72);border:2px solid rgba(120,140,220,.35);border-radius:20px;padding:18px 26px;width:860px}
.mod .ic{width:68px;height:68px;border-radius:16px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:none}
.mod .ic svg{width:40px;height:40px}
.mod b{font-size:30px;font-weight:700;line-height:1.15;display:block}
.mod small{font-size:22px;color:#AEB9D6;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:4px}
</style></head>
<body><div id="stage">
<canvas id="bg" width="1920" height="1080"></canvas>
<img class="logo" id="logo" src="logo-dark.png">
<div id="layers"></div>
<div class="cap" id="cap"><span id="captxt"></span></div>
</div>

 "itemGap": 1.93}, {"id": "who", "start": 225.696, "end": 244.584}, {"id": "cta", "start": 244.584, "end": 308}], "captions": [{"s": 1.2, "e": 4.492, "text": "The S three bucket was public for eleven days."}, {"s": 4.492, "e": 6.997, "text": "The pull request had two approvals."}, {"s": 6.997, "e": 9.144, "text": "Nobody read line two fourteen."}, {"s": 12.144, "e": 15.521, "text": "What if every configuration change got a reviewer that"}, {"s": 15.521, "e": 17.522, "text": "never gets tired, never guesses,"}, {"s": 17.522, "e": 19.398, "text": "and always shows its evidence?"}, {"s": 19.398, "e": 21.024, "text": "In two days you build one."}, {"s": 24.024, "e": 28.008, "text": "Gennoor Tech presents the Agentic Configuration Reviewer."}, {"s": 31.008, "e": 35.125, "text": "Deterministic rules decide. The model explains and drafts the"}, {"s": 35.125, "e": 38.904, "text": "fix. Native tooling validates. And the pull request gets"}, {"s": 38.904, "e": 40.591, "text": "a comment, never a merge."}, {"s": 40.591, "e": 43.561, "text": "That division of labour is the whole design,"}, {"s": 43.561, "e": 46.328, "text": "and it is why the reviewer can be trusted"}, {"s": 46.328, "e": 46.8, "text": "in C I."}, {"s": 49.8, "e": 53.594, "text": "Day one starts with parsers for Terraform plan output"}, {"s": 53.594, "e": 56.743, "text": "and Kubernetes YAML, using native libraries,"}, {"s": 56.743, "e": 59.034, "text": "so every finding keeps its file,"}, {"s": 59.034, "e": 62.112, "text": "line and resource provenance. Then a small,"}, {"s": 62.112, "e": 65.977, "text": "honest ruleset: public exposure, privileged workloads,"}, {"s": 65.977, "e": 69.556, "text": "overly broad permissions. Each rule has a stable I"}, {"s": 69.556, "e": 74.209, "text": "D, severity, rationale, references, exceptions and test fixtures,"}, {"s": 74.209, "e": 78.432, "text": "including secure configurations to measure false positives."}, {"s": 81.432, "e": 84.877, "text": "Then the agent. It receives the parsed resource and"}, {"s": 84.877, "e": 88.389, "text": "the rule evidence and returns a concise explanation,"}, {"s": 88.389, "e": 91.36, "text": "its uncertainty and a remediation rationale,"}, {"s": 91.36, "e": 94.467, "text": "in a strict schema. You verify that nothing it"}, {"s": 94.467, "e": 96.696, "text": "says can change a policy outcome."}, {"s": 99.696, "e": 102.981, "text": "Day two is remediation. Minimal candidate diffs,"}, {"s": 102.981, "e": 106.882, "text": "only for supported cases, never touching unrelated files."}, {"s": 106.882, "e": 109.346, "text": "Every patch runs through formatting,"}, {"s": 109.346, "e": 113.795, "text": "syntax validation, native tooling, policy checks and tests before"}, {"s": 113.795, "e": 116.464, "text": "it is allowed to call itself validated."}, {"s": 116.464, "e": 119.544, "text": "You will watch an invalid patch get rejected."}, {"s": 122.544, "e": 125.853, "text": "Then integration. A local review report first,"}, {"s": 125.853, "e": 130.025, "text": "then pull request comments in a sandbox repository through"}, {"s": 130.025, "e": 133.406, "text": "a C I workflow. The integration is read-only by"}, {"s": 133.406, "e": 137.218, "text": "default, handles untrusted repository content safely,"}, {"s": 137.218, "e": 140.671, "text": "and never merges. You finish with an evaluation:"}, {"s": 140.671, "e": 143.548, "text": "precision and recall on the fixture set,"}, {"s": 143.548, "e": 147.576, "text": "unsupported statements, patch validity and review noise."}, {"s": 150.576, "e": 154.852, "text": "Labs run on a sandbox repository with seeded misconfigurations,"}, {"s": 154.852, "e": 158.178, "text": "so you can see real pull request comments appear,"}, {"s": 158.178, "e": 161.232, "text": "with evidence and a validated patch attached."}, {"s": 164.232, "e": 166.838, "text": "Here is the full table of contents,"}, {"s": 166.838, "e": 168.626, "text": "6 modules over two days."}, {"s": 168.626, "e": 172.423, "text": "Day one: Supported formats, parsers and provenance;"}, {"s": 172.423, "e": 176.817, "text": "Deterministic policy rules; and AI explanations in a strict"}, {"s": 176.817, "e": 180.913, "text": "schema. Day two: Candidate diffs and native validation;"}, {"s": 180.913, "e": 184.413, "text": "Pull-request integration, read-only by default;"}, {"s": 184.413, "e": 188.136, "text": "and Evaluation, developer experience and capstone."}, {"s": 191.136, "e": 195.308, "text": "Every build in this course follows six engineering principles."}, {"s": 195.308, "e": 197.124, "text": "Model output is a proposal,"}, {"s": 197.124, "e": 200.623, "text": "never a fact. Authorization lives outside the model."}, {"s": 200.623, "e": 203.583, "text": "A human approves every consequential action."}, {"s": 203.583, "e": 205.871, "text": "Decisions and evidence are logged."}, {"s": 205.871, "e": 209.841, "text": "The stack stays provider-agnostic. And quality is measured,"}, {"s": 209.841, "e": 210.648, "text": "not assumed."}, {"s": 213.648, "e": 216.098, "text": "Two days, hands-on. Two formats,"}, {"s": 216.098, "e": 219.391, "text": "Terraform and Kubernetes. Zero auto-merges,"}, {"s": 219.391, "e": 222.913, "text": "ever. One C I integrated reviewer you can take"}, {"s": 222.913, "e": 223.296, "text": "home."}, {"s": 226.296, "e": 228.353, "text": "This course is for DevSecOps,"}, {"s": 228.353, "e": 232.892, "text": "platform and cloud engineers, infrastructure as code authors and"}, {"s": 232.892, "e": 236.013, "text": "security champions inside engineering teams."}, {"s": 236.013, "e": 238.85, "text": "You need Terraform or Kubernetes basics,"}, {"s": 238.85, "e": 242.184, "text": "Git and pull requests, and Python fundamentals."}, {"s": 245.184, "e": 248.055, "text": "Catch line two fourteen before it ships."}, {"s": 248.055, "e": 252.361, "text": "The Agentic Configuration Reviewer. Enrol now at gennoor dot"}, {"s": 252.361, "e": 252.648, "text": "com."}], "theme": {"moti const ctx=document.getElementById('bg').getContext('2d');
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

// network: drifting nodes and links across the frame
function mNetwork(t,a){const pts=nodes.map(n=>({x:n.x+Math.sin(t*0.25+n.ph)*n.dx*3,y:n.y+Math.cos(t*0.21+n.ph)*n.dy*3,c:n.c}));ctx.lineWidth=1.2;ctx.strokeStyle=TH.accent2;
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<260){ctx.globalAlpha=0.22*a*(1-d/260);ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}

const reqs=[];for(let i=0;i<26;i++)reqs.push({y:rnd()*700+120,sp:260+rnd()*220,ph:rnd()*9,bad:rnd()<0.42});
function mShield(t,a,big){const cx=big?1430:1500,cy=big?470:540,R=big?250:200;ctx.save();ctx.globalAlpha=a;
  ctx.lineWidth=5;ctx.strokeStyle=TH.accent;ctx.fillStyle=hexA(TH.accent,0.07);ctx.beginPath();ctx.moveTo(cx,cy-R);ctx.lineTo(cx+R*0.85,cy-R*0.62);ctx.lineTo(cx+R*0.85,cy+R*0.1);ctx.quadraticCurveTo(cx+R*0.85,cy+R*0.85,cx,cy+R*1.08);ctx.quadraticCurveTo(cx-R*0.85,cy+R*0.85,cx-R*0.85,cy+R*0.1);ctx.lineTo(cx-R*0.85,cy-R*0.62);ctx.closePath();ctx.fill();ctx.stroke();
  const pulse=0.5+0.5*Math.sin(t*2);ctx.globalAlpha=a*(0.15+0.25*pulse);ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy+R*0.15,R*1.25,0,6.28);ctx.stroke();

function mRadar(t,a,big){const cx=big?1430:1560,cy=big?480:560,R=big?340:230;ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=TH.accent;ctx.lineWidth=1.5;

function mCode(t,a,big){ctx.save();ctx.font='22px "DejaVu Sans Mono",monospace';for(const c of cols){const y0=(c.off+t*c.sp)%1200;for(let k=0;k<40;k++){const y=((k*34-y0)%1360+1360)%1360-140;if(y<-40||y>1120)continue;const m=c.marks[k];const bad=m>0.9,good=m<0.12;ctx.globalAlpha=a*(bad?0.95:good?0.8:0.28);ctx.fillStyle=bad?'#FF5A5A':good?'#5EE39A':TH.accent2;ctx.fillText(toks[(k*7+Math.floor(c.x))%toks.length],c.x,y);if(bad||good){ctx.beginPath();ctx.arc(c.x-18,y-7,7,0,6.28);ctx.fill();}}}ctx.restore();}

// ---------- panel rendering with typing ----------
function colorLine(l){const e=esc(l);if(l.startsWith('+'))return `<span class="add">${e}</span>`;if(l.startsWith('-'))return `<span class="del">${e}</span>`;if(l.startsWith('$'))return `<span class="cmd">${e}</span>`;if(l.startsWith('?')||/BLOCKED|FAIL|UNKNOWN|rejected|REVIEW|hold|reopened|GAP|MORE EVIDENCE/.test(l))return `<span class="warn">${e}</span>`;if(/APPROVED|VALIDATED|ok|passed|shortlist|FIXED|allowed|blocked\b/.test(l)&&!l.startsWith('>'))return `<span class="ok">${e}</span>`;if(l.startsWith('>'))return `<span>${e}</span>`;return `<span class="dim">${e}</span>`;}
function panelHtml(kind,lines){const dots='<i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i>';const title={terminal:'claude - agent session',diff:'review - pull request',cards:'workflow - results'}[kind]||'';return `<div class="bar">${dots}<span style="color:#7E8BB0;font-size:18px;margin-left:10px">${title}</span></div><pre></pre>`;}

const T=DATA.timeline; // [{id, start, end}]

function fadeEdge(t,s){const a=tw(t,s.start,0.5);const b=1-tw(t,s.end-0.5,0.5,easeIn);return Math.min(a,b);}
window.seek=function(t){

  else if(id.startsWith('path')){const i=+id.slice(4);slideX(g(`p${i}_c`),r,0.1,0.7,-80);DATA.paths[i].items.forEach((_,k)=>rise(g(`p${i}_i${k}`),r,0.9+k*(s.itemGap||1.4)));slideX(g(`p${i}_p`),r,0.5,0.8,120);typePanel(g(`p${i}_p`).querySelector('pre'),DATA.paths[i].panel_lines,r,1.4,s.cps||48);}
